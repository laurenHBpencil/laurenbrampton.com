<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found | Lauren Brampton</title>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link rel="icon" href="/images/icons/favicon.png" type="image/png">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      font-family: 'VT323', monospace;
      background: #3a6ea5 url('/images/icons/background.jpg') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      color: black;
    }

    .error-window {
      width: 440px;
      max-width: 92vw;
      background: #ece9d8;
      border: 2px solid #000080;
      box-shadow: 4px 4px #000;
    }

    .title-bar {
      background: linear-gradient(90deg, #000080, #245edb);
      color: white;
      padding: 6px 8px;
      font-size: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .title-bar a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      background: #d24726;
      border: 1px solid #fff;
      border-radius: 2px;
      padding: 0 7px;
    }

    .error-body {
      padding: 20px;
      display: flex;
      gap: 16px;
      align-items: flex-start;
      font-size: 20px;
    }

    .error-icon {
      font-size: 48px;
      line-height: 1;
    }

    .error-body h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .error-actions {
      padding: 0 20px 20px;
      display: flex;
      gap: 10px;
    }

    .btn {
      font-family: 'VT323', monospace;
      font-size: 18px;
      padding: 5px 20px;
      background: #ece9d8;
      border: 2px outset #f5f4ea;
      cursor: pointer;
      text-decoration: none;
      color: black;
      display: inline-block;
    }

    .btn:hover {
      background: #f5f4ea;
    }
  </style>
</head>

<body>
  <div class="error-window">
    <div class="title-bar">
      <span>C:\laurenbrampton.com\ - Error</span>
      <a href="/" title="Close">X</a>
    </div>
    <div class="error-body">
      <div class="error-icon">&#10060;</div>
      <div>
        <h1>404 - Page Not Found</h1>
        <p>This program has performed an illegal operation&hellip;<br>
          just kidding! The page you're looking for doesn't exist or has been moved.</p>
      </div>
    </div>
    <div class="error-actions">
      <a class="btn" href="/">Return to Desktop</a>
      <a class="btn" href="https://github.com/laurenHBpencil" target="_blank">Visit GitHub</a>
    </div>
  </div>
</body>

</html>
